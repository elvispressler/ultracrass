[build]
  command = "pnpm --filter @workspace/ultracrass run build"
  publish = "artifacts/ultracrass/dist/public"
  functions = "artifacts/ultracrass/netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
